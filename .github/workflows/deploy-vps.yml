name: Deploy VPS

# Déploie AnythingMCP sur le VPS via SSH.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   VPS_HOST      IP ou hostname du VPS            ex: 203.0.113.42
#   VPS_USER      utilisateur SSH                  ex: deploy
#   VPS_SSH_KEY   clé privée SSH (contenu complet, format OpenSSH)
# Secrets optionnels :
#   VPS_PORT      port SSH (défaut 22)
#   VPS_APP_DIR   chemin de l'app sur le VPS (défaut /opt/anythingmcp)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'content/**'
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild local des images au lieu d'un pull"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement SSH
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Vérifier les secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VPS_HOST:-}" ]    || missing="$missing VPS_HOST"
          [ -n "${VPS_USER:-}" ]    || missing="$missing VPS_USER"
          [ -n "${VPS_SSH_KEY:-}" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing"
            exit 1
          fi

      - name: Préparer la clé SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Déployer
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy \
              -p "${VPS_PORT:-22}" \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              "$VPS_USER@$VPS_HOST" \
              bash -se -- "${VPS_APP_DIR:-/opt/anythingmcp}" "$REBUILD" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$1"
          REBUILD="$2"

          cd "$APP_DIR"

          echo "▸ Mise à jour du code"
          git fetch --prune origin
          git reset --hard origin/main

          # .env et Caddyfile sont gitignorés : ils survivent au reset.
          test -f .env || { echo "::error::.env absent sur le VPS — lance d'abord ./setup.sh"; exit 1; }

          if [ "$REBUILD" = "true" ]; then
            echo "▸ Build des images"
            docker compose build --pull
          else
            echo "▸ Pull des images"
            docker compose pull
          fi

          echo "▸ Redémarrage de la stack"
          docker compose up -d --remove-orphans

          echo "▸ Nettoyage"
          docker image prune -f >/dev/null

          echo "▸ État des services"
          docker compose ps
          REMOTE

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" -o BatchMode=yes \
                 "$VPS_USER@$VPS_HOST" \
                 'curl -fsS --max-time 5 http://127.0.0.1:4000/health >/dev/null'; then
              echo "✅ Backend en bonne santé"
              exit 0
            fi
            echo "⏳ tentative $i/20…"
            sleep 6
          done
          echo "::error::Le backend ne répond pas sur /health après 2 minutes"
          exit 1

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy
