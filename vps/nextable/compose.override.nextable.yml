# =============================================================================
# Override Compose pour NexTable — permet à son Caddy de servir AnythingMCP.
#
# Destination sur le VPS : /opt/nextable/compose.override.nextable.yml
#
# ⚠️ NexTable utilise docker-compose.prod.yml, pas le nom standard : Compose ne
#    charge donc PAS d'override automatiquement. Il faut passer les deux -f :
#
#      cd /opt/nextable
#      docker compose -f docker-compose.prod.yml -f compose.override.nextable.yml up -d app
#
#    Ne jamais ajouter --remove-orphans : les conteneurs de monitoring
#    (grafana, prometheus, cadvisor, blackbox) appartiennent au même projet
#    `nextable` mais sont définis dans docker-compose.monitoring.yml, donc
#    Compose les verrait comme orphelins et les supprimerait.
#
# Deux changements, rien d'autre :
#   1. monte le Caddyfile étendu (le reste de la config NexTable est inchangé)
#   2. attache le conteneur au réseau d'AnythingMCP, pour que Caddy puisse
#      joindre amcp-app sans publier le moindre port supplémentaire
#
# ⚠️ Le réseau amcp_default doit exister AVANT d'appliquer cet override :
#    démarrer AnythingMCP en premier.
# =============================================================================

services:
  app:
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - default
      - amcp

networks:
  amcp:
    external: true
    name: amcp_default
